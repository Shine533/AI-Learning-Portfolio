<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>吴珊珊 Shine Wu · 双语数字营销专家</title>
<meta name="description" content="吴珊珊 (Shine Wu) — 双语数字营销专家，专注海外社媒运营、SEO 内容增长与跨境 B2B 线索获取。" />
<meta name="theme-color" content="#08131f" />
<meta property="og:type" content="website" />
<meta property="og:title" content="吴珊珊 Shine Wu · 双语数字营销专家" />
<meta property="og:description" content="海外社媒运营 · SEO 内容增长 · 社媒月均 40+ 询盘 · Facebook 月均 100+ B2B 线索" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231d4ed8'/%3E%3Ctext x='32' y='33' font-family='Segoe UI,sans-serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle' dominant-baseline='central'%3ES%3C/text%3E%3C/svg%3E" />
<style>
/* ============ 1. 变量与基础 ============ */
:root{
  --navy:#08131f; --blue:#1d4ed8; --blue-l:#3b82f6; --cyan:#06b6d4;
  --ink:#0f172a; --body:#4a5a70; --muted:#8496ad;
  --line:#e6ecf5; --soft:#f4f8ff; --white:#fff;
  --r:16px; --r-lg:22px;
  --sh:0 8px 26px rgba(15,23,42,.06);
  --sh-lg:0 26px 60px rgba(15,23,42,.14);
  --ease:cubic-bezier(.22,.68,.32,1);
  --nav-h:68px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--body);background:var(--white);line-height:1.75;
  font-size:15px;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
ul{list-style:none}
:focus-visible{outline:2px solid var(--blue-l);outline-offset:3px;border-radius:6px}
::selection{background:rgba(29,78,216,.16);color:var(--ink)}

.container{width:100%;max-width:1120px;margin:0 auto;padding:0 24px}
section[id]{scroll-margin-top:calc(var(--nav-h) + 12px)}

/* ============ 2. 顶部导航 ============ */
.progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:120;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  transition:width .1s linear}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  display:flex;align-items:center;transition:background .35s var(--ease),box-shadow .35s var(--ease),height .35s var(--ease)}
.nav__inner{width:100%;max-width:1120px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;gap:20px}
.nav__logo{font-weight:700;font-size:17px;letter-spacing:.3px;color:#fff;
  display:flex;align-items:center;gap:9px;transition:color .35s}
.nav__logo i{width:9px;height:9px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 0 4px rgba(6,182,212,.22);transition:background .35s,box-shadow .35s}
.nav__links{display:flex;gap:4px;margin-left:auto}
.nav__links a{position:relative;padding:7px 13px;border-radius:99px;font-size:14px;
  color:rgba(255,255,255,.76);font-weight:500;transition:color .25s,background .25s}
.nav__links a:hover{color:#fff;background:rgba(255,255,255,.11)}
.nav__links a.active{color:#fff;background:rgba(255,255,255,.16)}
.nav__actions{display:flex;align-items:center;gap:10px}
.lang{display:flex;align-items:center;gap:0;padding:4px;border-radius:99px;
  background:rgba(255,255,255,.13);font-size:13px;font-weight:600;transition:background .35s}
.lang button{padding:4px 12px;border-radius:99px;color:rgba(255,255,255,.66);
  transition:color .25s,background .25s}
.lang button.on{background:#fff;color:var(--blue)}
.nav.scrolled{background:rgba(255,255,255,.9);backdrop-filter:saturate(1.7) blur(14px);
  -webkit-backdrop-filter:saturate(1.7) blur(14px);height:60px;
  box-shadow:0 1px 0 var(--line),0 6px 22px rgba(15,23,42,.05)}
.nav.scrolled .nav__logo{color:var(--ink)}
.nav.scrolled .nav__logo i{background:var(--blue);box-shadow:0 0 0 4px rgba(29,78,216,.16)}
.nav.scrolled .nav__links a{color:var(--body)}
.nav.scrolled .nav__links a:hover{color:var(--ink);background:var(--soft)}
.nav.scrolled .nav__links a.active{color:var(--blue);background:rgba(29,78,216,.09)}
.nav.scrolled .lang{background:var(--soft)}
.nav.scrolled .lang button{color:var(--muted)}
.nav.scrolled .lang button.on{background:var(--blue);color:#fff}
.burger{display:none;width:38px;height:38px;border-radius:10px;
  background:rgba(255,255,255,.13);position:relative;transition:background .3s}
.burger span{position:absolute;left:11px;width:16px;height:2px;border-radius:2px;background:#fff;
  transition:transform .32s var(--ease),opacity .2s,background .35s}
.burger span:nth-child(1){top:13px}
.burger span:nth-child(2){top:18px}
.burger span:nth-child(3){top:23px}
.nav.scrolled .burger{background:var(--soft)}
.nav.scrolled .burger span{background:var(--ink)}
.burger.open span:nth-child(1){transform:translateY(5px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-5px) rotate(-45deg)}

/* ============ 3. 首页 Hero ============ */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;
  padding:calc(var(--nav-h) + 40px) 0 72px;overflow:hidden;
  background:#08131f;color:#fff;isolation:isolate}
.hero__bg{position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(1100px 620px at 12% 8%, #17408f 0%, transparent 58%),
    radial-gradient(880px 520px at 88% 18%, #0b6e82 0%, transparent 56%),
    linear-gradient(160deg,#0a1a2e 0%,#08131f 55%,#060e18 100%);
  animation:bgShift 18s ease-in-out infinite alternate}
@keyframes bgShift{from{transform:scale(1)}to{transform:scale(1.08)}}
.hero__grid{position:absolute;inset:0;z-index:-1;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:58px 58px;
  -webkit-mask-image:radial-gradient(circle at 50% 34%,#000 0%,transparent 72%);
  mask-image:radial-gradient(circle at 50% 34%,#000 0%,transparent 72%)}
.orb{position:absolute;border-radius:50%;filter:blur(46px);z-index:-1;opacity:.5}
.orb--a{width:300px;height:300px;background:#2563eb;top:16%;left:6%;animation:floatA 13s ease-in-out infinite}
.orb--b{width:240px;height:240px;background:#06b6d4;bottom:14%;right:8%;animation:floatB 16s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(48px,36px)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-30px)}}

.hero__inner{position:relative;z-index:2;display:grid;grid-template-columns:238px 1fr;
  gap:56px;align-items:center;width:100%;max-width:1120px;margin:0 auto;padding:0 24px}
.hero__avatar{position:relative;width:238px;height:238px}
.hero__avatar::after{content:"";position:absolute;inset:-9px;border-radius:50%;
  border:2px solid rgba(255,255,255,.16);
  border-top-color:var(--cyan);border-right-color:var(--blue-l);
  animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero__avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;
  box-shadow:0 22px 54px rgba(0,0,0,.42);animation:floatA 8s ease-in-out infinite}

.hero__eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;
  letter-spacing:1.6px;text-transform:uppercase;color:var(--cyan);margin-bottom:18px}
.hero__eyebrow::before{content:"";width:26px;height:2px;background:var(--cyan);border-radius:2px}
.hero__name{font-size:clamp(38px,6vw,62px);line-height:1.1;font-weight:800;color:#fff;
  letter-spacing:-1px;margin-bottom:6px}
.hero__sub{font-size:clamp(17px,2.4vw,22px);font-weight:600;color:rgba(255,255,255,.62);
  letter-spacing:3px;text-transform:uppercase;margin-bottom:20px}
.hero__tagline{font-size:clamp(16px,2.1vw,19px);font-weight:600;
  background:linear-gradient(96deg,#fff 10%,#7dd3fc 60%,#67e8f9 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:14px}
.hero__intro{font-size:16.5px;color:rgba(255,255,255,.72);max-width:600px;margin-bottom:28px}

.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:30px}
.stat{padding:14px 20px;border-radius:14px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);min-width:132px;
  transition:transform .35s var(--ease),background .35s,border-color .35s}
.stat:hover{transform:translateY(-5px);background:rgba(255,255,255,.12);border-color:rgba(6,182,212,.4)}
.stat__n{font-size:29px;font-weight:800;color:#fff;line-height:1.15;letter-spacing:-.5px}
.stat__n em{font-style:normal;color:var(--cyan)}
.stat__l{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:1px}

.hero__cta{display:flex;flex-wrap:wrap;gap:12px}
.hero__email{display:inline-flex;align-items:center;gap:14px;padding:14px 22px;border-radius:99px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#fff;font-size:16px;font-weight:600;letter-spacing:.2px;
  transition:transform .35s var(--ease),background .35s,border-color .35s,box-shadow .35s}
.hero__email:hover{transform:translateY(-3px);background:rgba(255,255,255,.14);
  border-color:rgba(6,182,212,.5);box-shadow:0 14px 32px rgba(6,182,212,.22)}
.hero__email:active{transform:translateY(-1px)}
.hero__email-icon{width:26px;height:26px;display:grid;place-items:center;border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));flex:none;color:#fff}
.hero__email-icon svg{width:14px;height:14px}
.hero__email-text{font-variant-numeric:tabular-nums}
.hero__email-hint{margin-left:6px;padding-left:14px;border-left:1px solid rgba(255,255,255,.18);
  font-size:12.5px;font-weight:500;color:rgba(255,255,255,.55);letter-spacing:.3px;
  white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border-radius:99px;
  font-size:14.5px;font-weight:600;transition:transform .3s var(--ease),box-shadow .3s,background .3s,color .3s}
.btn--primary{background:linear-gradient(96deg,var(--blue),var(--cyan));color:#fff;
  box-shadow:0 10px 26px rgba(29,78,216,.34)}
.btn--primary:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(29,78,216,.46)}
.btn--ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22)}
.btn--ghost:hover{transform:translateY(-3px);background:rgba(255,255,255,.15)}
.btn svg{width:16px;height:16px;flex:none}

.scrollcue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:11px;letter-spacing:2.4px;color:rgba(255,255,255,.42);text-transform:uppercase}
.scrollcue i{width:22px;height:36px;border:1.5px solid rgba(255,255,255,.28);border-radius:12px;position:relative}
.scrollcue i::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;border-radius:2px;
  background:var(--cyan);transform:translateX(-50%);animation:cue 1.7s ease-in-out infinite}
@keyframes cue{0%{opacity:0;transform:translate(-50%,0)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,13px)}}

/* ============ 4. 区块通用 ============ */
.section{padding:96px 0}
.section--soft{background:var(--soft)}
.section--dark{background:var(--navy);color:#fff}
.sec-head{margin-bottom:46px;max-width:660px}
.sec-head--center{margin-left:auto;margin-right:auto;text-align:center}
.sec-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
  letter-spacing:1.8px;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
.sec-tag::before{content:"";width:22px;height:2px;background:var(--blue);border-radius:2px}
.section--dark .sec-tag{color:var(--cyan)}
.section--dark .sec-tag::before{background:var(--cyan)}
.sec-title{font-size:clamp(26px,3.6vw,36px);font-weight:800;color:var(--ink);
  letter-spacing:-.6px;line-height:1.25}
.section--dark .sec-title{color:#fff}
.sec-desc{margin-top:12px;font-size:15.5px;color:var(--body)}
.section--dark .sec-desc{color:rgba(255,255,255,.62)}

/* ============ 5. 个人简介 ============ */
.about{display:grid;grid-template-columns:290px 1fr;gap:52px;align-items:start}
.about__photo{position:relative}
.about__photo img{width:100%;border-radius:var(--r-lg);box-shadow:var(--sh-lg)}
.about__photo::after{content:"";position:absolute;inset:14px -14px -14px 14px;border-radius:var(--r-lg);
  border:2px solid rgba(29,78,216,.22);z-index:-1}
.about__facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.fact{padding:8px 14px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:13px}
.fact b{color:var(--ink);font-weight:600}
.about__text p{margin-bottom:16px;font-size:16px}
.about__text p:last-child{margin-bottom:0}
.about__text strong{color:var(--ink);font-weight:600}
.edu{margin-top:28px;padding:20px 22px;border-radius:var(--r);
  background:var(--soft);border:1px solid var(--line);border-left:3px solid var(--blue)}
.edu__label{font-size:12px;font-weight:700;letter-spacing:1.4px;color:var(--blue);
  text-transform:uppercase;margin-bottom:10px}
.edu__row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.edu__school{font-weight:700;color:var(--ink);font-size:16px}
.edu__deg{color:var(--body)}
.edu__period{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ============ 6. 工作经历时间线 ============ */
.timeline{position:relative;padding-left:34px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--blue),var(--cyan),rgba(6,182,212,.12))}
.tl-item{position:relative;padding-bottom:34px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-30px;top:26px;width:14px;height:14px;border-radius:50%;
  background:#fff;border:3px solid var(--blue);box-shadow:0 0 0 5px rgba(29,78,216,.13);
  transition:transform .4s var(--ease),background .4s,box-shadow .4s}
.tl-item:hover::before{transform:scale(1.22);background:var(--cyan);
  border-color:var(--cyan);box-shadow:0 0 0 7px rgba(6,182,212,.19)}
.tl-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;
  box-shadow:var(--sh);transition:transform .4s var(--ease),box-shadow .4s,border-color .4s}
.tl-item:hover .tl-card{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:rgba(29,78,216,.24)}
.tl-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:4px}
.tl-role{font-size:17.5px;font-weight:700;color:var(--ink)}
.tl-period{margin-left:auto;font-size:13px;font-weight:600;color:var(--blue);
  background:rgba(29,78,216,.08);padding:3px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.tl-company{font-size:14.5px;color:var(--muted);margin-bottom:14px;display:flex;gap:8px;align-items:center}
.tl-points li{position:relative;padding-left:22px;margin-bottom:9px;font-size:15px}
.tl-points li:last-child{margin-bottom:0}
.tl-points li::before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--cyan))}

/* ============ 7. 项目经历卡片 ============ */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.card{position:relative;display:flex;flex-direction:column;padding:28px;border-radius:var(--r-lg);
  background:#fff;border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;
  transition:transform .45s var(--ease),box-shadow .45s,border-color .45s}
.card::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .45s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(29,78,216,.09),transparent 62%);pointer-events:none}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh-lg);border-color:rgba(29,78,216,.26)}
.card:hover::before{opacity:1}
.card__top{margin-bottom:14px}
.card__period{font-size:12.5px;font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums}
.card__name{font-size:19px;font-weight:700;color:var(--ink);margin:4px 0 3px;letter-spacing:-.2px}
.card__company{font-size:14px;color:var(--muted)}
.card__tags{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 18px}
.card__tags span{padding:4px 11px;border-radius:7px;background:var(--soft);border:1px solid var(--line);
  font-size:12px;font-weight:600;color:var(--blue)}
.card__points li{position:relative;padding-left:20px;margin-bottom:9px;font-size:14.5px}
.card__points li:last-child{margin-bottom:0}
.card__points li::before{content:"";position:absolute;left:2px;top:10px;width:6px;height:6px;border-radius:2px;
  background:linear-gradient(135deg,var(--blue),var(--cyan))}
.card__link{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);
  font-size:14px;font-weight:600;color:var(--blue);display:inline-flex;align-items:center;gap:7px;
  transition:gap .3s var(--ease)}
.card__link:hover{gap:12px}

/* ============ 8. 作品集 ============ */
.pf{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.pf-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh);text-align:left;
  transition:transform .45s var(--ease),box-shadow .45s,border-color .45s}
.pf-card:hover{transform:translateY(-7px);box-shadow:var(--sh-lg);border-color:rgba(29,78,216,.26)}
.pf-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;
  background:linear-gradient(135deg,#1e293b,#0f172a)}
.pf-thumb img{width:100%;height:100%;object-fit:cover;
  transition:transform .7s var(--ease),filter .5s}
.pf-card:hover .pf-thumb img{transform:scale(1.07)}
.pf-thumb img.img-fail{opacity:.18}
.pf-play{position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(8,19,31,.05),rgba(8,19,31,.5))}
.pf-play i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.94);box-shadow:0 10px 26px rgba(0,0,0,.28);
  transition:transform .45s var(--ease),background .3s}
.pf-card:hover .pf-play i{transform:scale(1.14);background:#fff}
.pf-play i::after{content:"";width:0;height:0;margin-left:4px;
  border-left:15px solid var(--blue);border-top:9.5px solid transparent;border-bottom:9.5px solid transparent}
.pf-platform{position:absolute;top:12px;left:12px;padding:5px 12px;border-radius:99px;font-size:11.5px;
  font-weight:700;letter-spacing:.4px;color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pf-platform--yt{background:rgba(220,38,38,.9)}
.pf-platform--fb{background:rgba(24,119,242,.92)}
.pf-views{position:absolute;bottom:12px;right:12px;padding:5px 12px;border-radius:99px;font-size:11.5px;
  font-weight:700;color:#fff;background:rgba(8,19,31,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pf-body{padding:20px 22px 24px;display:flex;flex-direction:column;flex:1}
.pf-title{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.5;margin-bottom:9px}
.pf-desc{font-size:14px;color:var(--body)}
.pf-note{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* ============ 9. 英文文案示例 ============ */
.copy{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.copy-card{background:#0c1a2b;border:1px solid rgba(255,255,255,.09);border-radius:var(--r-lg);
  padding:26px 28px;color:#fff;box-shadow:0 18px 44px rgba(8,19,31,.2)}
.copy-head{display:flex;align-items:center;gap:11px;margin-bottom:20px;
  padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.copy-num{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--blue),var(--cyan));font-size:14px;font-weight:800}
.copy-type{font-size:16px;font-weight:700;color:#fff}
.copy-type small{display:block;font-size:12px;font-weight:500;color:rgba(255,255,255,.45);letter-spacing:.4px}
.cb{margin-bottom:15px}
.cb:last-child{margin-bottom:0}
.cb__label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--cyan);margin-bottom:6px}
.cb__text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:13.5px;line-height:1.72;color:rgba(255,255,255,.86);word-break:break-word;
  background:rgba(255,255,255,.05);border-left:2px solid rgba(6,182,212,.5);
  padding:10px 14px;border-radius:0 8px 8px 0}
.cb__text--tags{color:#7dd3fc;line-height:1.9}
.cb__text--cta{color:#86efac;border-left-color:rgba(134,239,172,.5)}

.shot{display:grid;grid-template-columns:74px 1fr;gap:14px;padding-bottom:14px;margin-bottom:14px;
  border-bottom:1px dashed rgba(255,255,255,.13)}
.shot:last-of-type{border-bottom:0}
.shot__time{font-size:12.5px;font-weight:700;color:var(--cyan);
  font-variant-numeric:tabular-nums;padding-top:2px}
.shot__visual{font-size:13.5px;color:rgba(255,255,255,.7);margin-bottom:5px}
.shot__caption{font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:13px;
  color:#fff;background:rgba(255,255,255,.07);padding:8px 12px;border-radius:8px;
  border-left:2px solid rgba(29,78,216,.7)}
.copy-strategy{margin-top:18px;padding:14px 16px;border-radius:12px;
  background:rgba(6,182,212,.09);border:1px solid rgba(6,182,212,.22)}
.copy-strategy b{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--cyan);margin-bottom:6px}
.copy-strategy p{font-size:13.5px;color:rgba(255,255,255,.76);line-height:1.72}
.copy-flag{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:5px 12px;
  border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  font-size:11.5px;font-weight:600;color:rgba(255,255,255,.62);letter-spacing:.3px}

/* ============ 10. 技能标签云 & 证书 ============ */
.skills{display:flex;flex-direction:column;gap:26px}
.skill-group{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 26px;
  box-shadow:var(--sh)}
.sg__name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:16px;
  display:flex;align-items:center;gap:10px}
.sg__name::before{content:"";width:8px;height:8px;border-radius:3px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));flex:none}
.sg__name span{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.cloud{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tag{display:inline-flex;align-items:center;padding:8px 16px;border-radius:99px;
  font-weight:600;line-height:1.4;cursor:default;
  border:1px solid var(--line);background:var(--soft);color:var(--body);
  transition:transform .32s var(--ease),box-shadow .32s,color .32s,border-color .32s,background .32s}
.tag:hover{transform:translateY(-4px) scale(1.04);color:#fff;background:var(--blue);
  border-color:var(--blue);box-shadow:0 10px 22px rgba(29,78,216,.28)}
.tag--1{font-size:12.5px}
.tag--2{font-size:14px;color:var(--ink)}
.tag--3{font-size:16px;color:var(--ink);background:rgba(29,78,216,.07);border-color:rgba(29,78,216,.18)}
.tag--4{font-size:18px;font-weight:700;color:var(--blue);
  background:rgba(29,78,216,.1);border-color:rgba(29,78,216,.26)}
.section--dark .skill-group{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.1)}
.section--dark .sg__name{color:#fff}
.section--dark .sg__name span{color:rgba(255,255,255,.4)}
.section--dark .tag{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.78)}
.section--dark .tag--2,.section--dark .tag--3{color:#fff}
.section--dark .tag--4{color:var(--cyan);background:rgba(6,182,212,.14);border-color:rgba(6,182,212,.3)}
.section--dark .tag:hover{background:var(--cyan);border-color:var(--cyan);color:#04263a;
  box-shadow:0 10px 22px rgba(6,182,212,.3)}

.certs-title{font-size:19px;font-weight:700;color:var(--ink);margin:44px 0 20px;text-align:center}
.section--dark .certs-title{color:#fff}
.certs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.cert{display:flex;align-items:center;gap:11px;padding:13px 20px;border-radius:14px;
  background:#fff;border:1px solid var(--line);box-shadow:var(--sh);
  transition:transform .35s var(--ease),box-shadow .35s,border-color .35s}
.cert:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:rgba(29,78,216,.3)}
.cert svg{width:19px;height:19px;flex:none;color:var(--blue)}
.cert b{font-size:14.5px;color:var(--ink);font-weight:600}
.cert small{display:block;font-size:12px;color:var(--muted)}

/* ============ 11. 页脚 ============ */
.footer{background:var(--navy);color:#fff;padding:84px 0 34px;position:relative;overflow:hidden}
.footer::before{content:"";position:absolute;inset:0;
  background:radial-gradient(700px 340px at 50% 0%,rgba(29,78,216,.28),transparent 70%)}
.footer .container{position:relative}
.footer__title{font-size:clamp(26px,3.6vw,36px);font-weight:800;text-align:center;letter-spacing:-.6px}
.footer__desc{text-align:center;color:rgba(255,255,255,.6);margin:14px auto 34px;max-width:520px}
.footer__cta{display:flex;flex-wrap:wrap;gap:13px;justify-content:center;margin-bottom:38px}
.footer__copy{text-align:center;font-size:12.5px;color:rgba(255,255,255,.34);margin-top:30px}

/* ============ 12. 视频弹窗 & 提示 ============ */
.modal{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.modal.open{opacity:1;pointer-events:auto}
.modal__bd{position:absolute;inset:0;background:rgba(4,10,18,.86);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal__box{position:relative;width:100%;max-width:900px;border-radius:var(--r-lg);overflow:hidden;
  background:#000;box-shadow:0 34px 80px rgba(0,0,0,.55);
  transform:scale(.93) translateY(14px);transition:transform .42s var(--ease)}
.modal.open .modal__box{transform:none}
.modal__box iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.modal__close{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;
  transition:background .3s,transform .3s}
.modal__close:hover{background:rgba(220,38,38,.9);transform:rotate(90deg)}
.modal__link{position:absolute;bottom:0;left:0;right:0;padding:13px 20px;text-align:center;
  font-size:13.5px;font-weight:600;color:#fff;background:rgba(8,19,31,.82);transition:background .3s}
.modal__link:hover{background:var(--blue)}

.toast{position:fixed;bottom:30px;left:50%;transform:translate(-50%,20px);z-index:300;
  padding:12px 22px;border-radius:99px;background:var(--ink);color:#fff;font-size:14px;font-weight:500;
  box-shadow:0 14px 34px rgba(0,0,0,.3);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .35s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 13. 滚动揭示动画 ============ */
.rv{opacity:0;transform:translateY(30px);
  transition:opacity .8s var(--ease),transform .8s var(--ease);
  transition-delay:var(--d,0ms);will-change:opacity,transform}
.rv.in{opacity:1;transform:none}
.rv-zoom{opacity:0;transform:scale(.94) translateY(20px);
  transition:opacity .75s var(--ease),transform .75s var(--ease);transition-delay:var(--d,0ms)}
.rv-zoom.in{opacity:1;transform:none}
.rv-left{opacity:0;transform:translateX(-34px);
  transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0ms)}
.rv-left.in{opacity:1;transform:none}

/* ============ 14. 响应式 ============ */
@media (max-width:960px){
  .hero__inner{grid-template-columns:1fr;gap:34px;justify-items:center;text-align:center}
  .hero__avatar{width:172px;height:172px}
  .hero__eyebrow{justify-content:center}
  .hero__intro{margin-left:auto;margin-right:auto}
  .stats{justify-content:center}
  .hero__cta{justify-content:center}
  .about{grid-template-columns:1fr;gap:34px}
  .about__photo{max-width:290px;margin:0 auto}
  .about__photo::after{display:none}
  .about__facts{justify-content:center}
  .cards,.copy,.pf{grid-template-columns:1fr}
  .scrollcue{display:none}
}
@media (max-width:760px){
  .burger{display:block}
  .nav__links{position:fixed;top:var(--nav-h);left:0;right:0;flex-direction:column;gap:4px;
    padding:14px 20px 22px;background:rgba(255,255,255,.97);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 40px rgba(15,23,42,.14);
    transform:translateY(-14px);opacity:0;pointer-events:none;
    transition:transform .35s var(--ease),opacity .3s}
  .nav__links.open{transform:none;opacity:1;pointer-events:auto}
  .nav__links a{color:var(--body);padding:11px 14px;border-radius:10px;font-size:15px}
  .nav__links a:hover,.nav__links a.active{color:var(--blue);background:var(--soft)}
  .section{padding:68px 0}
  .container{padding:0 18px}
  .sec-head{margin-bottom:34px}
  .timeline{padding-left:28px}
  .timeline::before{left:6px}
  .tl-item::before{left:-27px;top:22px;width:12px;height:12px}
  .tl-card{padding:20px 18px}
  .tl-head{flex-direction:column;gap:2px}
  .tl-period{margin-left:0;align-self:flex-start;margin-top:6px}
  .card,.pf-card,.copy-card,.skill-group{padding:22px 18px}
  .pf-body{padding:18px 18px 20px}
  .stat{flex:1 1 128px;min-width:0}
  .footer{padding:64px 0 28px}
  .modal{padding:14px}
}
@media (max-width:420px){
  .stat__n{font-size:24px}
  .btn{padding:12px 18px;font-size:14px}
}

/* ============ 15. 减少动效 & 打印 ============ */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv,.rv-zoom,.rv-left{opacity:1!important;transform:none!important;transition:none!important}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
@media print{
  .nav,.progress,.scrollcue,.modal,.toast,.hero__bg,.hero__grid,.orb{display:none!important}
  body{color:#000;background:#fff}
  .hero{color:#000;background:#fff;min-height:auto;padding:20px 0}
  .hero__name,.hero__sub,.hero__tagline,.hero__intro,.sec-title,.tl-role,.card__name{color:#000;
    -webkit-text-fill-color:#000}
  .section{padding:30px 0;break-inside:avoid}
  .copy-card{background:#fff;color:#000;border-color:#ccc}
  .copy-type,.cb__text,.shot__caption,.copy-strategy p,.copy-strategy b{color:#000}
}
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<header class="nav" id="nav">
  <div class="nav__inner">
    <a href="#hero" class="nav__logo"><i></i><span>Shine Wu</span></a>
    <nav class="nav__links" id="navLinks">
      <a href="#hero" data-nav="hero"></a>
      <a href="#about" data-nav="about"></a>
      <a href="#experience" data-nav="experience"></a>
      <a href="#projects" data-nav="projects"></a>
      <a href="#portfolio" data-nav="portfolio"></a>
      <a href="#copywriting" data-nav="copywriting"></a>

      <a href="#contact" data-nav="contact"></a>
    </nav>
    <div class="nav__actions">
      <div class="lang" id="lang">
        <button data-lang="zh" class="on">中</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main>

  <!-- ===== 首页 ===== -->
  <section class="hero" id="hero">
    <div class="hero__bg"></div>
    <div class="hero__grid"></div>
    <div class="orb orb--a"></div>
    <div class="orb orb--b"></div>
    <div class="hero__inner">
      <div class="hero__avatar">
        <img id="avatar" alt="吴珊珊 Shine Wu" />
      </div>
      <div class="hero__text">
        <div class="hero__eyebrow rv" id="heroEyebrow"></div>
        <h1 class="hero__name rv" id="heroName"></h1>
        <div class="hero__sub rv" id="heroSub"></div>
        <p class="hero__tagline rv" id="heroTagline"></p>
        <p class="hero__intro rv" id="heroIntro"></p>
        <div class="stats" id="stats"></div>
        <div class="hero__cta rv" id="heroCta"></div>
      </div>
    </div>
    <a class="scrollcue" href="#about"><i></i><span>Scroll</span></a>
  </section>

  <!-- ===== 个人简介 ===== -->
  <section class="section" id="about">
    <div class="container">
      <div class="sec-head rv">
        <div class="sec-tag" data-i18n="about.tag"></div>
        <h2 class="sec-title" data-i18n="about.title"></h2>
        <p class="sec-desc" data-i18n="about.desc"></p>
      </div>
      <div class="about">
        <div class="about__photo rv-left">
          <img id="aboutPhoto" alt="吴珊珊 Shine Wu" />
          <div class="about__facts" id="facts"></div>
        </div>
        <div class="about__body">
          <div class="about__text rv" id="aboutText"></div>
          <div class="edu rv" id="edu"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 工作经历 ===== -->
  <section class="section section--soft" id="experience">
    <div class="container">
      <div class="sec-head rv">
        <div class="sec-tag" data-i18n="exp.tag"></div>
        <h2 class="sec-title" data-i18n="exp.title"></h2>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <!-- ===== 项目经历 ===== -->
  <section class="section" id="projects">
    <div class="container">
      <div class="sec-head rv">
        <div class="sec-tag" data-i18n="proj.tag"></div>
        <h2 class="sec-title" data-i18n="proj.title"></h2>
      </div>
      <div class="cards" id="projectCards"></div>
    </div>
  </section>

  <!-- ===== 作品集 ===== -->
  <section class="section section--soft" id="portfolio">
    <div class="container">
      <div class="sec-head rv">
        <div class="sec-tag" data-i18n="pf.tag"></div>
        <h2 class="sec-title" data-i18n="pf.title"></h2>
        <p class="sec-desc" data-i18n="pf.desc"></p>
      </div>
      <div class="pf" id="portfolioGrid"></div>
    </div>
  </section>

  <!-- ===== 英文文案示例 ===== -->
  <section class="section section--dark" id="copywriting">
    <div class="container">
      <div class="sec-head rv">
        <div class="sec-tag" data-i18n="copy.tag"></div>
        <h2 class="sec-title" data-i18n="copy.title"></h2>
        <p class="sec-desc" data-i18n="copy.desc"></p>
      </div>
      <div class="copy" id="copyGrid"></div>
    </div>
  </section>

  <!-- ===== 技能与证书 ===== -->
  <section class="section" id="skills">
    <div class="container">
      <div class="sec-head sec-head--center rv">
        <div class="sec-tag" data-i18n="sk.tag"></div>
        <h2 class="sec-title" data-i18n="sk.title"></h2>
        <p class="sec-desc" data-i18n="sk.desc"></p>
      </div>
      <div class="skills" id="skillGroups"></div>
      <h3 class="certs-title rv" data-i18n="sk.certs"></h3>
      <div class="certs" id="certList"></div>
    </div>
  </section>

</main>

<footer class="footer" id="contact">
  <div class="container">
    <h2 class="footer__title rv" data-i18n="ct.title"></h2>
    <p class="footer__desc rv" data-i18n="ct.desc"></p>
    <div class="footer__cta rv" id="footerCta"></div>
    <p class="footer__copy" id="footerCopy"></p>
  </div>
</footer>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__bd" data-close></div>
  <div class="modal__box">
    <button class="modal__close" data-close aria-label="Close">&times;</button>
    <div id="modalFrame"></div>
    <a class="modal__link" id="modalLink" target="_blank" rel="noopener"></a>
  </div>
</div>

<div class="toast" id="toast"></div>

    }, { threshold: 0.12, rootMargin: '0px 0px -48px 0px' });
  }
  function observeReveals() {
    var els = document.querySelectorAll('.rv,.rv-zoom,.rv-left');
    if (!io) { els.forEach(function (el) { el.classList.add('in'); }); return; }
    els.forEach(function (el) { if (!el.classList.contains('in')) io.observe(el); });
  }

  /* ---------- 数字滚动 ---------- */
  function runCounters() {
    document.querySelectorAll('[data-count]').forEach(function (el) {
      var target = parseInt(el.getAttribute('data-count'), 10);
      if (el.dataset.done) return;
      el.dataset.done = '1';
      var start = null, dur = 1400;
      function step(ts) {
        if (!start) start = ts;
        var p = Math.min((ts - start) / dur, 1);
        var eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(target * eased);
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  /* ---------- 卡片磁吸 / 光晕 ---------- */
  function bindTilt() {
    if (window.matchMedia('(hover: none)').matches) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('.tilt').forEach(function (card) {
      card.addEventListener('pointermove', function (e) {
        var r = card.getBoundingClientRect();
        var px = (e.clientX - r.left) / r.width;
        var py = (e.clientY - r.top) / r.height;
        card.style.setProperty('--mx', (px * 100) + '%');
        card.style.setProperty('--my', (py * 100) + '%');
        card.style.transform = 'perspective(900px) rotateX(' + ((0.5 - py) * 5).toFixed(2) +
          'deg) rotateY(' + ((px - 0.5) * 5).toFixed(2) + 'deg) translateY(-7px)';
      });
      card.addEventListener('pointerleave', function () { card.style.transform = ''; });
    });
  }

  /* ---------- 语言切换 ---------- */
  function setLang(next) {
    lang = next;
    try { localStorage.setItem('shine-lang', lang); } catch (e) {}
    document.querySelectorAll('#lang button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-lang') === lang);
    });
    render();
    startCounters();
  }
  $('lang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (b) setLang(b.getAttribute('data-lang'));
  });

  /* ---------- 数字动画触发（首屏延迟一点，看得清） ---------- */
  function startCounters() { setTimeout(runCounters, 380); }

  /* ---------- 移动端菜单 ---------- */
  var burger = $('burger'), navLinks = $('navLinks');
  burger.addEventListener('click', function () {
    navLinks.classList.toggle('open');
    burger.classList.toggle('open');
  });
  navLinks.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') {
      navLinks.classList.remove('open');
      burger.classList.remove('open');
    }
  });

  /* ---------- 滚动：进度条 / 导航态 / 高亮 ---------- */
  var nav = $('nav'), bar = $('progress');
  function onScroll() {
    var y = window.scrollY;
    nav.classList.toggle('scrolled', y > 24);
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? (y / h) * 100 : 0) + '%';
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  if ('IntersectionObserver' in window) {
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          document.querySelectorAll('.nav__links a').forEach(function (a) {
            a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id);
          });
        }
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    ['hero','about','experience','projects','portfolio','copywriting','skills','contact'].forEach(function (id) {
      spy.observe(document.getElementById(id));
    });
  }

  /* ---------- 视频弹窗 ---------- */
  var modal = $('modal'), frame = $('modalFrame'), mLink = $('modalLink');
  function openVideo(v) {
    frame.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + v.videoId +
      '?autoplay=1&rel=0&playsinline=1" title="' + esc(v.title) +
      '" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    mLink.href = 'https://www.youtube.com/watch?v=' + v.videoId;
    mLink.textContent = (lang === 'zh' ? '在 YouTube 打开 ↗' : 'Watch on YouTube ↗');
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    setTimeout(function () { frame.innerHTML = ''; }, 300);
    document.body.style.overflow = '';
  }
  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeModal();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  $('portfolioGrid').addEventListener('click', function (e) {
    var card = e.target.closest('.pf-card');
    if (!card || card.tagName === 'A') return;
    var v = DATA[lang].portfolio[+card.getAttribute('data-idx')];
    if (v && v.videoId) openVideo(v);
  });

  /* ---------- 复制邮箱 ---------- */
  var toast = $('toast'), toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2000);
  }
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-copy]');
    if (!btn) return;
    var text = btn.getAttribute('data-copy');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(I18N[lang]['toast.copied']);
      }, function () { showToast(text); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast(I18N[lang]['toast.copied']); }
      catch (err) { showToast(text); }
      document.body.removeChild(ta);
    }
  });

  /* ---------- 初始化 ---------- */
  $('avatar').src = AVATAR;
  $('aboutPhoto').src = AVATAR;
  setLang(lang);
  onScroll();
})();
</script>
</body>
</html>
